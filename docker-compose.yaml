services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env          # TELOXIDE_TOKEN=...
    environment:
      # Dev-режим без проверки initData на сервере запрещён, даже если он включён в .env
      API_AUTH_DISABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./promts:/app/promts

  # Telegram Mini App: раздаёт фронт и проксирует /api на бота этого проекта.
  # HTTPS делает nginx на сервере, он же по домену выбирает нужный фронт.
  # Чтобы рядом работали несколько ботов (тест/прод), у каждого в .env свои
  # COMPOSE_PROJECT_NAME и WEB_PORT.
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ":80"                       # только http внутри, без собственных сертификатов
      API_UPSTREAM: bot:${PORT:-8080}     # PORT бота из .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"  # доступен только с самого сервера (для nginx)
    depends_on:
      - bot
